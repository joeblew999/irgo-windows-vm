# Publish the site to GitHub Pages.
#
# Same shape as the other two workflows: install mise, call the task. The site
# is built by `mise run site:build`, so what CI publishes is exactly what
# `mise run site:serve` shows you locally — there is no build step here that a
# maintainer cannot run.
#
# The site is GENERATED from the repository's markdown and is never committed.
# README and every page in docs/ are each the source of
# truth for their subject, and the site renders them. If a page is wrong, the
# markdown is wrong; there is no second copy to fix.
name: pages

on:
  push:
    branches: [main]
  # Again when a conformance run on main finishes, so the Glaze status page
  # shows its record and screenshots without waiting for the next push.
  workflow_run:
    workflows: [conformance]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Read the repo, write Pages. Nothing else — this workflow publishes docs and
# has no business with contents:write, which release.yml needs and this does not.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # gh run download: the conformance artifacts

# One deployment at a time, and let a running one finish. Cancelling a
# half-finished deploy is how a site ends up serving a partial upload — so this
# stays false, even though check.yml cancels. The build job below is cheap and
# the deploy is the part that must not be interrupted.
concurrency:
  group: pages
  cancel-in-progress: false

# mise.toml also pins TinyGo (1.2 GB installed), binaryen, node and wrangler
# for worker/, which no job here builds. install_args alone does not keep
# them out: `mise run` installs every tool in mise.toml first (measured 1 Oct
# 2026, a fresh data dir with only Go installed pulled all 16).
env:
  MISE_TASK_RUN_AUTO_INSTALL: false

jobs:
  build:
    # ubuntu, not macOS: this only renders markdown. The macOS runners exist in
    # the other workflows because the code they test drives UTM, and none of
    # that is involved here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.2.4
        # Only the Go tools; the env block at the top stops `mise run` installing
        # the rest, TinyGo and wrangler for worker/, which no job here builds.
        with:
          install_args: go golangci-lint goreleaser

      # site:build compiles docsite and, through the hooks in site/ (the command
      # reference and the MCP page), the CLI itself — both from a cold cache on
      # every push. Same cache as check,
      # different key prefix so the two do not overwrite each other's entries.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-site-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-site-${{ runner.os }}-
      # No `enablement: true` here, though the failure this workflow first hit
      # recommends it. It cannot work: enabling Pages is a CREATE against the
      # API, and the workflow's GITHUB_TOKEN is not allowed to do it whatever
      # permissions are granted above — the second attempt failed with
      # "Create Pages site failed. Resource not accessible by integration".
      #
      # Pages is enabled once, out of band, by somebody with admin on the repo:
      #
      #   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
      #
      # or Settings > Pages > Source > GitHub Actions. After that this step
      # only reads the configuration and succeeds.
      - uses: actions/configure-pages@v6.0.0

      # The Glaze status page shows the latest conformance run on main —
      # its record and its screenshots, for macOS and Windows — rather than
      # whatever was last committed. The latest COMPLETED run, failed ones
      # included: a failing test, with the picture of its window, is exactly
      # what that page is for, and "latest green" would hide it. Cancelled
      # runs are skipped. With no such run, or no artifacts left (they
      # expire), the committed docs/GLAZE-STATUS.md and
      # docs/screens/conformance/ are published as they are.
      #
      # glaze-check -import does the merging (internal/glazecheck, Import):
      # each artifact's section replaces its target's, its screenshots replace
      # that target's directory, and the Screenshots table is redrawn. Nothing
      # is committed; this changes only the tree the site is built from.
      - name: take the latest conformance run's record and screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow conformance.yml --branch main \
            --status completed --limit 20 --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "no completed conformance run on main: publishing the committed record"
            exit 0
          fi
          echo "conformance run $run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
          if ! gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'conformance-*' --dir ci-conformance; then
            echo "run $run has no conformance artifacts left: publishing the committed record"
            exit 0
          fi
          # A run from before screenshots existed has artifacts without them;
          # that is "nothing to import", not a failed deploy.
          if ! go run ./cmd/irgo-winvm glaze-check -import ci-conformance; then
            echo "run $run could not be imported: publishing the committed record"
            git checkout -- docs && git clean -fdq docs
          fi

      - name: build the site
        run: mise run site:build

      # No link check here. `docsite check` builds the site and checks every
      # local href, src and #anchor, the corpus and the links into the site
      # from the code; it runs in check.yml via `mise run go:check`, on the
      # same push.

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
