# Does glaze work? The conformance suite (examples/conformance) on GitHub's
# own macOS and Windows ARM64 machines, on every push and pull request.
#
# It is the same suite, run the same way, as `mise run glaze:mac` on a desk and
# `mise run glaze:windows` on the VM: `irgo-winvm glaze-check` compiles it with
# `go test -c`, runs the binary with -test.v=test2json, converts the output
# with `go tool test2json`, and records every test. Nothing here reimplements
# that; the job only runs it and keeps what it wrote.
#
# Why this exists beside the VM. Until it did, "does glaze work on Windows?"
# was answered on exactly one machine — the owner's Mac, one UTM VM — so a
# result nobody else could reproduce, and one nobody saw for a pull request.
# The VM stays the reference (a known image, a known WebView2, an interactive
# user session set up by this repo), and this is the second opinion that runs
# for everyone.
#
# Both runners have a desktop session: glaze's own CI opens real WKWebView and
# WebView2 windows on GitHub's hosted macOS and Windows runners, and WebView2
# ships with Windows 11. So the whole suite runs on both, GUI tests included —
# nothing is -short here.
#
# Known upstream bugs. The suite does not skip them: TestAppScheme/
# absolute_subresources FAILS on Windows (docs/reference/upstream.md §1b), and the table
# in the job summary shows it failing, with its reference. glaze-check exits 0
# when the ONLY failures are ones listed in glazecheck.KnownUpstream (verdict
# "KNOWN BUGS ONLY"), so this job stays green for a change that broke nothing
# and goes red for any new failure. It also goes red when a known failure
# starts passing ("UNEXPECTED PASS"): the fix has landed and the list is out of
# date, or the test stopped testing what it names. Either needs a person.
name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

# mise.toml also pins TinyGo (1.2 GB installed), binaryen, node and wrangler
# for worker/, which no job here builds. install_args alone does not keep
# them out: `mise run` installs every tool in mise.toml first (measured 1 Oct
# 2026, a fresh data dir with only Go installed pulled all 16).
env:
  MISE_TASK_RUN_AUTO_INSTALL: false

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # The suite takes seconds and bounds itself (-test.timeout=3m inside
    # glaze-check). Fifteen minutes is the build plus a hang, not a wait.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      # macOS: the maintainer's own route — mise installs the pinned Go, and
      # glaze:mac is the task a maintainer runs.
      - if: runner.os == 'macOS'
        uses: jdx/mise-action@v4.2.4
        # Only the Go tools; the env block at the top stops `mise run` installing
        # the rest, TinyGo and wrangler for worker/, which no job here builds.
        with:
          install_args: go golangci-lint goreleaser
      - if: runner.os == 'macOS'
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-conformance-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-conformance-${{ runner.os }}-
      - if: runner.os == 'macOS'
        run: mise run glaze:mac

      # Windows: setup-go rather than mise. mise.toml is written for the Mac —
      # its [env] reads $HOME and its tasks are bash — and the tool is a macOS
      # program that only glaze-check makes sense of on Windows. The Go version
      # is the same pin: every go.mod says the version mise.toml pins
      # (docs/contributing.md, mise tasks), and go-version-file reads it from there.
      - if: runner.os == 'Windows'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      # The windows-11-arm image comes up with a full-screen "Microsoft account"
      # prompt (WWAHost.exe) over every window, with the Start menu open under
      # it, and Chromium drops a wheel event aimed at a window something else
      # covers (TestDriveScroll, 1 Oct 2026). The script lists every shown
      # window and the foreground one, stops what covers the desktop or can
      # take the foreground on its own, lists again, and fails if the prompt
      # or Start is still up. This is a disposable runner.
      - if: runner.os == 'Windows'
        name: clear the desktop
        shell: pwsh
        run: .github/scripts/runner-desktop.ps1 -Clear
      - if: runner.os == 'Windows'
        shell: bash
        run: go run ./cmd/irgo-winvm glaze-check
      # What was on the desktop when the suite ended, for a failure's record.
      - if: always() && runner.os == 'Windows'
        name: the desktop after the suite
        shell: pwsh
        run: .github/scripts/runner-desktop.ps1

      # What glaze-check wrote, kept whatever the verdict: the record (the
      # same table the job summary shows), this runner's screenshots with
      # their manifest, the full log, and the test2json events. The log
      # directory is the tool's fixed one, under the home directory on both.
      #
      # Only this runner's target's screenshots: docs/screens/conformance also
      # holds the other target's committed ones, and `glaze-check -import` in
      # pages.yml takes a target's section from whichever artifact carries
      # its screenshots. The layout (GLAZE-STATUS.md beside
      # screens/conformance/<target>/) is what Import looks for.
      - name: Collect the record
        if: always()
        shell: bash
        run: |
          mkdir -p conformance-results/screens/conformance
          cp docs/GLAZE-STATUS.md conformance-results/
          target=mac; [ "$RUNNER_OS" = Windows ] && target=windows
          if [ -d "docs/screens/conformance/$target" ]; then
            cp -R "docs/screens/conformance/$target" conformance-results/screens/conformance/
          fi
          cp "$HOME/Library/Application Support/irgo-winvm/logs/"glaze-* conformance-results/
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: conformance-${{ matrix.os }}
          path: conformance-results/
          if-no-files-found: error

      # The same record, posted to the Cloudflare Worker (worker/), so its
      # Glaze status page shows this run within seconds instead of after the
      # next pages deploy. Pushes to main only: a pull request's run must not
      # become "the latest". `glaze-check -post` sends it through the tool's
      # one Worker client (internal/workerclient, its routes from
      # wire/routes.go), the code every other caller of the Worker uses: the
      # manifest and exactly the pictures it names. It does nothing but say
      # so until the owner sets the repository variable GLAZE_STATUS_URL (the
      # Worker's origin) and the secret GLAZE_STATUS_TOKEN (docs/worker.md,
      # "Deploying it").
      # continue-on-error: a Worker that is down is not a glaze failure, and
      # the step still shows red.
      - name: Post the record to the Worker
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          GLAZE_STATUS_URL: ${{ vars.GLAZE_STATUS_URL }}
          GLAZE_STATUS_TOKEN: ${{ secrets.GLAZE_STATUS_TOKEN }}
        run: |
          target=mac; [ "$RUNNER_OS" = Windows ] && target=windows
          go run ./cmd/irgo-winvm glaze-check -post "$target"
