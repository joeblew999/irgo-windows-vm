# The Cloudflare Worker for irgo-windows-vm. docs/DEVELOPMENT.md, "The
# Cloudflare Worker", says what it does, how to run it locally and the exact
# steps to deploy it. Nothing here is a secret: secrets are set with
# `wrangler secret put`, and locally in .dev.vars (gitignored).
name = "irgo-windows-vm"
main = "build/worker.mjs"
compatibility_date = "2026-09-01"

[build]
command = "mise run worker:wasm"

# The site: site/dist, built by `mise run site:build`. Cloudflare serves a
# matching file before the Worker runs, so pages cost no Worker CPU; only
# /api/* goes to the Go handler first.
[assets]
directory = "../site/dist"
run_worker_first = ["/api/*"]
html_handling = "auto-trailing-slash"

# Public data: the glaze runs CI posts, read back by the Glaze status page.
[[r2_buckets]]
binding = "SITE"
bucket_name = "irgo-windows-vm-site"

# The golden image's private bucket. Bound here and reached only through
# /api/golden/*, behind GOLDEN_TOKEN (read) and GOLDEN_PUSH_TOKEN (write); a
# binding is not a public route, so the bucket keeps no public access
# (docs/DEVELOPMENT.md, "The private R2 cache").
[[r2_buckets]]
binding = "GOLDEN"
bucket_name = "irgo-golden"

# The remote job queue (worker/jobs.go): jobs/index.json, every live job, and
# each job's binary, log and results. Private, reached only through
# /api/jobs, /api/runner and /api/mcp behind JOBS_TOKENS, JOBS_ADMIN_TOKEN
# and JOBS_RUNNER_TOKEN. A lifecycle rule deletes jobs/ after 7 days.
[[r2_buckets]]
binding = "JOBS"
bucket_name = "irgo-jobs"
