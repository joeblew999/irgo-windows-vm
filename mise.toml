[tools]
# Pinned so CI installs what a maintainer has. mise-action reads this.
go = "1.26.5"
golangci-lint = "2.11.2"

# Maintainer tasks. A user of the binary never needs this file.
#
# Namespaced by what they drive, and alphabetical:
#
#   iso:*   the Windows media
#   vm:*    the VM
#   app:*   your binary on that VM
#   go:*    the Go toolchain and the analysers
#   doctor  what is here; belongs to no stage because it reports on all of them
#
# The command tasks are the commands and nothing else. If a task here does more
# than call the binary, that logic belongs in the binary — which is why iso:test,
# vm:test and app:test are the only ones with a script: they are checks, not
# capabilities a user needs.

[tasks."app:create"]
description = "irgo-winvm app-create — your own .exe"
run = "go run ./cmd/irgo-winvm app-create"

# One pair per program this repository can put on a VM.
#
# There are four, not one: examples/ holds glaze-all alone, but probe/ and
# glaze-probes/ are runnable too and are the ones that actually answer the
# question this project exists to ask. Naming each of them means `mise tasks`
# lists what can be run, rather than leaving three of the four discoverable only
# by reading directories.
#
# They are ordinary uses of app:create above and get no special treatment in the
# tool: a probe is a Windows binary, and app-create runs any Windows binary.
# What differs between them is only where the source is and whether it needs a
# desktop, so that is all these tasks say.
#
# -gui or not is the split enforced in the code: without it the guest agent runs
# the binary as SYSTEM in session 0, where there is no window station and every
# windowed call fails.
#
# Output goes to .bin/win/, which is gitignored, and the delete half names the
# same path without rebuilding — app-delete only needs to know what to remove.

[tasks."app:create:glaze-all"]
description = "examples/glaze-all — the windowed capability report, on the VM"
# -probe because glaze-all opens its window and waits when run with no flags:
# it is an example first, and its default is the hands-on mode. An unattended
# caller wants an exit code and nothing left open, so it says so.
run = [
  "GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go -C examples build -o {{config_root}}/.bin/win/glaze-all.exe ./glaze-all",
  "go run ./cmd/irgo-winvm app-create -gui {{config_root}}/.bin/win/glaze-all.exe -probe",
]

[tasks."app:create:glaze-all:hands"]
description = "examples/glaze-all — the window, left up on the VM to drive by hand"
# No -probe, so it opens the window and waits for a person. -detach because of
# that: a window nobody closes never exits, so waiting for it can only end in
# the timeout. Without it this sat silent for ten minutes and read as a hang.
run = [
  "GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go -C examples build -o {{config_root}}/.bin/win/glaze-all.exe ./glaze-all",
  "go run ./cmd/irgo-winvm app-create -gui -detach {{config_root}}/.bin/win/glaze-all.exe",
]

[tasks."app:create:probe"]
description = "probe/ — the headless native capabilities, on the VM"
run = [
  "GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go -C probe build -o {{config_root}}/.bin/win/probe.exe .",
  "go run ./cmd/irgo-winvm app-create {{config_root}}/.bin/win/probe.exe",
]

[tasks."app:create:verify"]
description = "glaze-probes/verify — the portless app:// path, on the VM"
run = [
  "GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go -C glaze-probes build -o {{config_root}}/.bin/win/verify.exe ./verify",
  "go run ./cmd/irgo-winvm app-create -gui {{config_root}}/.bin/win/verify.exe",
]

[tasks."app:create:verify-events"]
description = "glaze-probes/verifyevents — the Events bridge, on the VM"
run = [
  "GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go -C glaze-probes build -o {{config_root}}/.bin/win/verify-events.exe ./verifyevents",
  "go run ./cmd/irgo-winvm app-create -gui {{config_root}}/.bin/win/verify-events.exe",
]

[tasks."app:delete"]
description = "irgo-winvm app-delete — your own .exe"
run = "go run ./cmd/irgo-winvm app-delete"

[tasks."app:delete:glaze-all"]
description = "Take glaze-all off the VM"
run = "go run ./cmd/irgo-winvm app-delete {{config_root}}/.bin/win/glaze-all.exe"

[tasks."app:delete:probe"]
description = "Take probe off the VM"
run = "go run ./cmd/irgo-winvm app-delete {{config_root}}/.bin/win/probe.exe"

[tasks."app:delete:verify"]
description = "Take verify off the VM"
run = "go run ./cmd/irgo-winvm app-delete {{config_root}}/.bin/win/verify.exe"

[tasks."app:delete:verify-events"]
description = "Take verify-events off the VM"
run = "go run ./cmd/irgo-winvm app-delete {{config_root}}/.bin/win/verify-events.exe"

[tasks."app:test"]
description = "Put a binary on a VM, run it, and remove it"
run = '''
set -e
# No precondition check here any more. It shelled out to `utmctl ip-address` to
# decide whether the guest agent was up, which meant this file held both the
# VM's name and a second opinion about what "ready" means -- and app-create
# already answers that, recovers a VM that has rebooted, and says what to run
# if Windows is not installed yet.
#
# Through the named tasks, not a hand-rolled build of the same thing. This ran
# `go build` into a mktemp hello.exe, which tested a path no user takes and
# would have kept passing after app:create:probe broke.
echo "=== create: push it and run it ==="
mise run app:create:probe

echo
echo "=== delete: take it off again ==="
mise run app:delete:probe

echo
echo "=== deleting again is success, not an error ==="
mise run app:delete:probe

echo
echo "app create and delete cycle complete"
'''

[tasks."doctor"]
description = "irgo-winvm doctor"
run = "go run ./cmd/irgo-winvm doctor"

[tasks."go:build"]
description = "Build irgo-winvm for every Mac a user could have"
run = '''
set -e
V=${VERSION:-dev}
OUT=${OUT:-dist}
rm -rf "$OUT" && mkdir -p "$OUT"

# Only macOS. UTM is macOS-only and the tool drives it, so a Linux or Windows
# binary would build and then refuse to do anything — the cross-compile in
# go:check exists to prove `targets` still reports honestly on those hosts, not
# to ship them.
for arch in arm64 amd64; do
  name="irgo-winvm-darwin-$arch"
  CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
    -ldflags "-s -w -X main.version=$V" -o "$OUT/$name" ./cmd/irgo-winvm
  ( cd "$OUT" && tar czf "$name.tar.gz" "$name" && rm "$name" )
  echo "built $OUT/$name.tar.gz"
done

( cd "$OUT" && shasum -a 256 *.tar.gz > SHA256SUMS )
cat "$OUT/SHA256SUMS"
'''

[tasks."go:check"]
description = "Build, vet and test every module, and cross-compile every target"
run = [
  "go build ./...",
  "go vet ./...",
  "go test ./utmvm/...",

  # The other three are separate modules and would be skipped by ./... above.
  # -o a directory because they are all main packages: a bare `go build` drops
  # binaries in the source tree, and in examples/ it fails outright because
  # `glaze-all` is already a directory there.
  "go -C probe build -o {{config_root}}/.bin/host/ ./...",
  "go -C probe vet ./...",
  "go -C glaze-probes build -o {{config_root}}/.bin/host/ ./...",
  "go -C glaze-probes vet ./...",
  "go -C examples build -o {{config_root}}/.bin/host/ ./...",
  "go -C examples vet ./...",
  "go -C examples test ./...",

  # The CLI must compile for every host a developer might be on: `targets`
  # exists to tell someone on Windows or Linux what their machine can do, and a
  # tool that will not build for them is no use. A macOS-only syscall with no
  # counterpart broke this once and was invisible from a Mac.
  "GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./...",
  "GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./...",
  "GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./...",
  "GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./...",
  "GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./...",

  # And the probes must cross-compile with no C toolchain. If that ever needs
  # one, something has taken a cgo dependency and this project's central claim
  # has quietly stopped being true.
  "CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go -C probe build -o /dev/null .",
  "CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go -C glaze-probes build -o /dev/null ./verify",
  "CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go -C examples build -o /dev/null ./glaze-all",
]

[tasks."go:lint"]
description = "The analysers, with everything they found already fixed"
run = "golangci-lint run --no-config -E unused,ineffassign,staticcheck,errcheck ./..."

[tasks."help"]
description = "irgo-winvm help"
run = "go run ./cmd/irgo-winvm help"

[tasks."iso:create"]
description = "irgo-winvm iso-create"
run = "go run ./cmd/irgo-winvm iso-create"

[tasks."iso:delete"]
description = "irgo-winvm iso-delete"
run = "go run ./cmd/irgo-winvm iso-delete"

[tasks."iso:test"]
description = "The ISO tests"
run = "go test ./utmvm/ -run 'TestVerdict|TestInspectISO|TestProtect|TestISOLinks|TestISO|TestDownload' -v"

[tasks."vm:create"]
description = "irgo-winvm vm-create"
run = "go run ./cmd/irgo-winvm vm-create"

[tasks."vm:delete"]
description = "irgo-winvm vm-delete"
run = "go run ./cmd/irgo-winvm vm-delete"

[tasks."vm:screen"]
description = "irgo-winvm vm-screen"
run = "go run ./cmd/irgo-winvm vm-screen"

[tasks."vm:test"]
description = "Create a VM and delete it, against a disposable name"
run = '''
set -e
VM=irgo-test-cycle

# vm-create restarts UTM so it sees the new bundle, and quitting UTM takes any
# running VM down with it. Refuse rather than cost somebody a 45-minute
# install they had running.
if go run ./cmd/irgo-winvm doctor 2>/dev/null | grep -q started; then
  echo "a VM is running; vm-create restarts UTM and would stop it" >&2
  exit 1
fi

echo "=== create ==="
go run ./cmd/irgo-winvm vm-create -vm "$VM"

echo
echo "=== it exists ==="
utmctl status "$VM" || { echo "UTM does not know $VM" >&2; exit 1; }

echo
echo "=== delete refuses without -force ==="
if go run ./cmd/irgo-winvm vm-delete -vm "$VM"; then
  echo "vm-delete deleted without -force" >&2; exit 1
fi

echo
echo "=== delete ==="
go run ./cmd/irgo-winvm vm-delete -vm "$VM" -force

echo
echo "=== it is gone, and no phantom entry is left ==="
if utmctl status "$VM" 2>/dev/null; then
  echo "$VM still registered with UTM" >&2; exit 1
fi

echo
echo "=== deleting again is success, not an error ==="
go run ./cmd/irgo-winvm vm-delete -vm "$VM"

echo
echo "create and delete cycle complete"
'''
