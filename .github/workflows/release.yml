# Publish binaries a user can download and run.
#
# Same shape as check.yml: install mise, run what a maintainer runs. The build
# is .goreleaser.yaml, and GoReleaser is pinned in mise.toml, so a maintainer
# running `mise run go:build` on a clean checkout of the tag produces the same
# bytes this publishes, and can see them before tagging.
#
# That sentence was false once, and is true because it was checked. v0.1.0's
# published binary could not be reproduced from its own tag: Go stamps the
# commit, the build time and a dirty-tree flag into every binary, so CI
# (vcs.modified=false), a working copy (true) and a clean worktree (no stamps at
# all) produced three different binaries from one commit. .goreleaser.yaml
# passes -buildvcs=false, and the checksums mean something again.
#
# macOS only, deliberately. The tool drives UTM, which is macOS-only, so a Linux
# binary would build and then refuse to do anything useful.
name: release

on:
  push:
    tags: ["v*"]
  # A dry run: a snapshot build uploaded as an artefact. Nothing is published.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Built on macOS so the binaries are produced on the platform they target.
    # The gate itself is not repeated here — see the guard below.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # GoReleaser reads the tags to find this release and the one before
          # it, for the version and the changelog. A shallow clone has neither.
          fetch-depth: 0
      - uses: jdx/mise-action@v4.2.4

      # Two Mac architectures; same cache as check's macOS job so it is not
      # doing that from cold.
      #
      # The path list must be check.yml's exactly, not just the key. actions/cache
      # versions an entry by its paths as well as its key, so this listed two of
      # check's three paths and, under the identical key, restored nothing check
      # had saved — "same cache" in name only. Measured on v0.4.1: check's macOS
      # job hit go-macOS-f475403d… at 09:11 on 14 Aug 2026, and this job, three
      # minutes later on the same commit, logged "Cache not found" for that key.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # Nothing ships that has not passed the gate — but the gate is not run
      # again here.
      #
      # A tag names a commit that `check` has already run on, on both a Mac and
      # ubuntu. Re-running it cost 124s of a 171s release, 72% of the whole
      # thing, to re-derive an answer GitHub already had.
      #
      # So this asks instead, and refuses to publish if the answer is missing or
      # red. That is stricter than what it replaced in one way worth naming: the
      # old version would happily build a tag whose commit had never been
      # checked, because it checked it right there and then. This will not.
      #
      # Only for a real publish. A workflow_dispatch dry run builds nothing that
      # reaches anybody, so it does not need the guard and should not be blocked
      # by a branch that has never been pushed.
      - name: the tagged commit must have a green check
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "commit: $SHA"

          # --json is used rather than parsing text: a column layout change
          # would silently turn this into a check that passes on anything.
          runs=$(gh run list --workflow=check.yml --commit "$SHA" \
                   --json conclusion,status,databaseId,url)

          if [ "$(echo "$runs" | jq 'length')" = "0" ]; then
            echo "::error::no check run exists for $SHA — refusing to publish an unverified commit"
            exit 1
          fi
          echo "$runs" | jq -r '.[] | "  \(.status)/\(.conclusion // "pending")  \(.url)"'

          if [ "$(echo "$runs" | jq '[.[] | select(.conclusion == "success")] | length')" = "0" ]; then
            echo "::error::no SUCCESSFUL check run for $SHA — refusing to publish"
            exit 1
          fi
          echo "a green check exists for this commit; publishing"

      # Builds, checksums, writes the notes (the header in .goreleaser.yaml plus
      # the commits since the last tag) and creates the GitHub release. It
      # refuses a dirty tree and a commit that is not the tag, so what it
      # publishes is what the tag names.
      - name: publish
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean

      - name: build (dry run)
        if: github.ref_type != 'tag'
        run: mise run go:build

      - uses: actions/upload-artifact@v7.0.1
        if: github.ref_type != 'tag'
        with:
          name: irgo-winvm-dev
          path: |
            dist/irgo-winvm-darwin-*
            dist/SHA256SUMS
