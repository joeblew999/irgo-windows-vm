blurb = "Why it works the way it does"

[[page]]
src = "docs/concepts/architecture.md"
out = "architecture.html"
title = "Architecture"
parent = "concepts.html"
blurb = "How the code is built: stages, packages, locks, jobs, data, the golden image"

# Intent: it names commands in the context of what an attacker could call,
# which is not telling a reader to run them, so cmd/irgo-winvm/docs_test.go
# does not require every command it names to exist.
[[page]]
src = "docs/concepts/threat-model.md"
out = "threat-model.html"
title = "Threat model"
parent = "concepts.html"
blurb = "What anyone who reaches the HTTP port can do"
intent = true

[[page]]
src = "docs/reference.md"
out = "reference-index.html"
title = "Reference"
nav = "Reference"
blurb = "Commands, MCP tools, the Worker API, traps, upstream bugs, the status records"

# Captured from the binary: `irgo-winvm help`, and `-h` for every command.
[[page]]
out = "reference.html"
title = "Commands"
parent = "reference-index.html"
blurb = "Every command and flag, captured from the binary"
footer = "Built from the Go code at build time (the binary, or the Worker's route table); nothing on it is typed by hand. To correct this page, change the Go code: no markdown file feeds it."
generate = { run = ["go", "run", "./site", "reference"] }

# Built by listing a live MCP server, so the page cannot describe a tool the
# server does not offer.
[[page]]
out = "mcp.html"
title = "MCP"
parent = "reference-index.html"
blurb = "The MCP server's tools, arguments and instructions, captured from a live server"
footer = "Built from the Go code at build time (the binary, or the Worker's route table); nothing on it is typed by hand. To correct this page, change the Go code: no markdown file feeds it."
generate = { run = ["go", "run", "./site", "mcp"] }

# From the Worker's route table in package wire, the table the Worker routes
# by and the tool's client builds requests from. To render the OpenAPI
# document instead: generate = { file = "worker/openapi.json", format = "openapi" }.
[[page]]
out = "api.html"
title = "Worker API"
parent = "reference-index.html"
blurb = "Every endpoint of the Cloudflare Worker, generated from its route table"
footer = "Built from the Go code at build time (the binary, or the Worker's route table); nothing on it is typed by hand. To correct this page, change the Go code: no markdown file feeds it."
generate = { run = ["go", "run", "./site", "api"] }

