# Tools, environment, and the tasks. A task longer than one line is a script
# in mise-tasks/ (the path is the name: mise-tasks/go/check is go:check), and
# its findings are comments in that script. `mise tasks` lists them all; the
# reasons behind the ones below are in docs/CONTRIBUTING.md under "mise tasks".

[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
goreleaser = "2.18.2"
# The Cloudflare Worker in worker/ (docs/WORKER.md, "The Cloudflare
# Worker"): TinyGo builds its Wasm, wrangler runs it locally and deploys it, and
# wrangler is an npm package, so node is pinned with it. CI installs only the
# Go tools (install_args, and MISE_TASK_RUN_AUTO_INSTALL=false so `mise run`
# does not install the rest), so none of these slow a check.
tinygo = "0.42.0"
# wasm-opt, which tinygo runs on every -target wasm build and fails without.
"aqua:WebAssembly/binaryen" = "133"
node = "24.19.0"
"npm:wrangler" = "4.143.0"

[env]
# Local glaze/native clones, for upstream:*. Bugs there are fixed there.
UPSTREAM_DIR = "{{env.HOME}}/workspace/go/src/github.com/crgimenes"
# irgo-winvm on PATH: .bin/irgo-winvm, built by go:tool.
_.path = ["{{config_root}}/.bin"]
# The private R2 cache's credentials, if this machine has them: gitignored,
# redacted in mise's output, and absent is fine (measured with mise 2026.9.15).
_.file = { path = ".env.r2", redact = true }

[tasks."go:tool"]
description = "Build irgo-winvm into .bin/ — the binary every task here runs"
sources = ["go.mod", "go.sum", "cmd/**/*", "internal/**/*"]
outputs = [".bin/irgo-winvm"]
run = "go build -o .bin/irgo-winvm ./cmd/irgo-winvm"

[tasks."go:lint"]
description = "The analysers, with everything they found already fixed"
run = "GOOS=darwin golangci-lint run --no-config -E unused,ineffassign,staticcheck,errcheck ./..."

[tasks."site:build"]
description = "Render the markdown into site/dist"
run = "go -C site run . -root .. -out dist"

[tasks."site:serve"]
description = "Build the site and serve it at http://localhost:8127 to check it"
run = "go -C site run . -root .. -out dist -serve -port ${PORT:-8127}"

[tasks."vm:shots"]
description = "Publish the newest shot of each stage into docs/screens/vm"
depends = ["go:tool"]
run = "irgo-winvm vm-screen -promote {{config_root}}/docs/screens/vm"

[tasks."upstream:unlink"]
description = "Go back to the released glaze and native modules"
run = "rm -f go.work go.work.sum && echo 'unlinked — back to the versions in each go.mod'"

[tasks."glaze:hands"]
description = "glaze-all on the VM with its window left up, to drive by hand"
depends = ["go:tool"]
# It opens the window and waits for a person. -detach because of that: a window
# nobody closes never exits, so waiting for it can only end in the timeout.
# Without it this sat silent for ten minutes and read as a hang.
run = [
  "GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go -C examples build -trimpath -ldflags='-s -w' -o {{config_root}}/.bin/win/glaze-all.exe ./glaze-all",
  "irgo-winvm app-create -gui -detach {{config_root}}/.bin/win/glaze-all.exe",
]

[tasks."glaze:mac"]
# The inner loop. glaze and native run natively on macOS, cgo-free, so the same
# conformance suite glaze:windows puts on the VM runs here in seconds, no VM.
# Windows stays the gate before a commit; this is for every edit before it.
#
# A wrapper, which the rule above says a task should not be — kept because the
# go:tool dependency rebuilds the binary first, and because these two names are
# what every doc and habit says. The logic (one test binary, test2json events,
# every test recorded in docs/GLAZE-STATUS.md, known upstream failures told
# apart from new ones, the full log and the events kept in the log dir) is in
# internal/glazecheck. It was two shell scripts here that printed YES or NO and
# threw it away.
description = "Does glaze work on this Mac? The conformance suite, every test recorded in docs/GLAZE-STATUS.md, ~5s, no VM"
depends = ["go:tool"]
run = "irgo-winvm glaze-check"

[tasks."glaze:windows"]
# The gate. The same suite, compiled with `go test -c` for Windows ARM64
# (stripped, since utmctl file push moves ~0.4 MB/s and size is time), run on
# the VM's desktop through app-create -gui with -test.v=test2json.
description = "Does glaze work on Windows? The conformance suite on the VM, every test recorded in docs/GLAZE-STATUS.md"
depends = ["go:tool"]
run = "irgo-winvm glaze-check -windows"
