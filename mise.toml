# Tasks for working on irgo-windows-vm.
#
# The project is four Go modules that are deliberately not one:
#
#   .              the CLI and utmvm — macOS-only, no glaze, no native
#   probe/         the headless native capability probe (module `nativeprobe`)
#   glaze-probes/  glaze's app:// origin and Events bridge proofs
#   examples/      runnable examples that use glaze AND native
#
# Splitting them keeps glaze and native out of the VM tooling's dependency
# graph, which is what lets the CLI cross-compile with nothing installed. The
# cost is that `go build ./...` covers one module of the four, and everything
# here has to walk all of them by hand — `go -C <dir>` rather than a path from
# the root, because a path from the root is not in the root module at all and
# fails with "main module does not contain package". That is the whole reason
# this file exists.
#
#   mise tasks       every task, with what it is for
#   mise run check   what Verification in PLAN.md asks for
#   mise run probes  build every probe for Windows — do this after a restart
#
# Go is deliberately NOT pinned in [tools]. It manages its own version: the
# `go` directive in each go.mod is a floor and the toolchain mechanism fetches
# what a module needs. A second manager on the same job disagrees with the
# first — pinning 1.25 against a module resolving 1.26 fails every package with
# "compile: version does not match go tool version" from a clone that built a
# moment earlier.

[env]
# Where `probes` writes and where `run` reads. One variable, so the two cannot
# drift apart and leave a stale binary being run against fresh source.
#
# It is inside the repo, not /tmp: PLAN.md's first open item is that the probes
# are hand-built into /tmp today and a restart loses them. .bin/ is gitignored
# and survives.
PROBE_DIR = "{{config_root}}/.bin"

# The VM these tasks talk to. Override for a second one:
#   VM=other-win mise run vm:status
VM = "irgo-win11"

# Where local clones of glaze and native live, for `upstream:verify`. A bug in
# either is fixed THERE, not worked around here — the README says why, and
# UPSTREAM.md tracks each one.
UPSTREAM_DIR = "{{env.HOME}}/workspace/go/src/github.com/crgimenes"

# The same names the Go code reads, so a task and a bare `irgo-winvm` agree
# about where things are. Everything large is here and overridable, because an
# ISO is 5 GB, a VM is 25 GB, and building an ISO needs room for both a copy of
# one and the result — which does not always fit on the disk the repo is on.
#
#   IRGO_WORK_DIR=/Volumes/big/irgo-work mise run iso:build <esd>
#
# IRGO_UPSTREAM_DIR is set from UPSTREAM_DIR above so there is one answer, not
# two that drift.
IRGO_ROOT = "{{config_root}}"
IRGO_CACHE_DIR = "{{config_root}}/.cache"
IRGO_BIN_DIR = "{{config_root}}/.bin"
IRGO_WORK_DIR = "{{config_root}}/.work"
IRGO_UPSTREAM_DIR = "{{env.HOME}}/workspace/go/src/github.com/crgimenes"
# Screenshots are the only thing here meant to be COMMITTED: a picture of
# Windows Setup running from a self-built ISO is the evidence, and evidence
# that lives only on the machine that made it convinces nobody.
IRGO_SCREENS_DIR = "{{config_root}}/docs/screens"

[tasks.setup]
# The one command a new developer runs. Idempotent: every stage checks whether
# it is already done, so a second run takes seconds rather than an hour.
#
# Without flags it will not spend your bandwidth or 45 minutes without being
# asked — -fetch permits the 4.2 GB download, -install permits the unattended
# Windows installation.
description = "EVERYTHING, idempotently: media, VM, Windows. Start here."
run = "go run ./cmd/irgo-winvm setup"

[tasks."setup:full"]
description = "setup, including a 4.2 GB download and a 45-minute Windows install"
run = "go run ./cmd/irgo-winvm setup -fetch -install"

[tasks.check]
# Everything PLAN.md's Verification section asks for, in one command, across
# all four modules.
#
# -race on utmvm only: it is where the concurrency is (UTM control, install
# driving), and it is the only module whose tests do not need a desktop.
description = "Build, vet and test every module — run this before every commit"
run = [
  "go build ./...",
  "go vet ./...",
  "go test -race ./utmvm/...",
  # Every module below is a main package, and `go build ./...` drops the binary
  # in the current directory — leaving `probe/nativeprobe` and friends sitting
  # untracked in the source tree after a check. In examples/ it does not even
  # get that far: `nativeall` is already a directory there, so the build fails
  # with "build output already exists and is a directory". `-o <dir>/` puts
  # them all somewhere gitignored instead.
  "go -C probe build -o {{config_root}}/.bin/host/ ./...",
  "go -C probe vet ./...",
  "go -C glaze-probes build -o {{config_root}}/.bin/host/ ./...",
  "go -C glaze-probes vet ./...",
  "go -C examples build -o {{config_root}}/.bin/host/ ./...",
  "go -C examples vet ./...",
  "go -C examples test ./...",
]

[tasks.fuzz]
# Kept out of `check` because it is measured in seconds per target and `check`
# is meant to be run constantly. Both targets exist because a malformed ISO and
# a malformed config are the two inputs that reach parsing code from outside.
description = "Run both fuzz targets for 30s each"
run = [
  "go test -run=NONE -fuzz=FuzzInspectISO -fuzztime=30s ./utmvm/",
  "go test -run=NONE -fuzz=FuzzParseUTMVersion -fuzztime=30s ./utmvm/",
]

[tasks.probes]
# The task PLAN.md item 1 asks for, until the CLI grows `probes build -o`.
#
# Both architectures every time. arm64 is the primary target and the only place
# glaze's hand-written AAPCS64 register passing is ever executed; amd64 is what
# glaze's own CI runs, so having both makes a failure attributable to the
# architecture rather than to the change.
#
# CGO_ENABLED=0 is the point of the whole exercise, not a precaution: glaze and
# native are cgo-free, so this needs no mingw and no toolchain at all. If a
# build here ever needs one, something has taken a cgo dependency and the
# project's central claim has quietly stopped being true.
description = "Cross-compile every probe for Windows arm64 and amd64 into .bin/"
run = '''
set -e
mkdir -p "$PROBE_DIR"
for arch in arm64 amd64; do
  CGO_ENABLED=0 GOOS=windows GOARCH=$arch \
    go -C probe build -o "$PROBE_DIR/nativeprobe-$arch.exe" .
  for p in verify verifyevents; do
    CGO_ENABLED=0 GOOS=windows GOARCH=$arch \
      go -C glaze-probes build -o "$PROBE_DIR/glaze-$p-$arch.exe" ./$p
  done
  CGO_ENABLED=0 GOOS=windows GOARCH=$arch \
    go -C examples build -o "$PROBE_DIR/nativeall-$arch.exe" ./nativeall
done
ls -l "$PROBE_DIR"
'''

[tasks.example]
# The example on the machine you are sitting at. It exits on its own with a
# non-zero code if any capability FAILED, so it needs no supervision — but it
# does open a window, a tray icon and a file dialog, so it needs a desktop
# session and cannot run over ssh.
description = "Run the nativeall report locally (needs a desktop session)"
run = "go -C examples run ./nativeall"

[tasks."example:try"]
# The same capabilities with nobody driving them but you. The report answers
# "does it work"; this answers "what is it like", which no table can — a tray
# you click, a dialog you pick a file in, a Dock icon that changes.
description = "Try every native capability by hand, in a window"
run = "go -C examples run ./nativeall -i"

[tasks."vm:try"]
# The interactive example inside Windows. -gui is mandatory: under the guest
# agent alone it is SYSTEM in session 0, with no window station at all.
#
# CLOSE THE WINDOW when you are done. It holds the window open until you do,
# and only then does the command return with the log. If the timeout expires
# first the command fails — and the app is STILL RUNNING in the guest, because
# the timeout deletes the scheduled task, which is not the process it started.
# Then:
#
#   mise run vm:kill
#
# The log arrives all at once at the end, not live: `utmctl exec` never returns
# output, so the run captures it to a file in the guest and pulls it afterwards.
# To watch what is happening meanwhile, take a picture of the screen —
# `mise run vm:shot` needs no agent and works while the app holds the session.
description = "Try every native capability by hand, in the Windows VM"
depends = ["probes"]
run = "go run ./cmd/irgo-winvm run -gui -timeout 30m -vm $VM $PROBE_DIR/nativeall-arm64.exe -i"

[tasks."vm:shot"]
# Works with no guest agent at all — it goes through UTM, not the guest — so it
# is what to reach for when something in there is wedged, or holding the
# session, or has not booted far enough to answer.
description = "Photograph the VM's screen"
run = "go run ./cmd/irgo-winvm screenshot -vm $VM -o {{config_root}}/.bin/$VM.png"

[tasks."vm:kill"]
# The other half of vm:try's timeout. Not automatic: killing whatever a person
# left open, on a timer, is how you lose the state you were looking at.
description = "Kill a windowed probe left running in the guest"
usage = 'arg "<exe>" help="image name, e.g. nativeall-arm64.exe"'
run = "go run ./cmd/irgo-winvm exec -vm $VM -cmd 'taskkill /F /IM $usage_exe'"

[tasks."vm:status"]
description = "State, IP, and whether the guest agent answers"
run = "go run ./cmd/irgo-winvm status -vm $VM"

[tasks."vm:boot"]
# -installed boots the installed Windows rather than the install CD. Every boot
# needs driving: UTM's aarch64 firmware never auto-selects a boot entry.
description = "Boot the installed Windows and drive it past the UEFI shell"
run = "go run ./cmd/irgo-winvm boot -vm $VM -installed"

[tasks."vm:probe"]
# The headless half: no window, so the guest agent's session 0 is enough.
description = "Run the native capability probe in the VM"
depends = ["probes"]
run = "go run ./cmd/irgo-winvm run -timeout 3m -vm $VM $PROBE_DIR/nativeprobe-arm64.exe"

[tasks."vm:probe-gui"]
# -gui is not optional for anything with a window. Under the guest agent alone
# the binary runs as SYSTEM in session 0, where there is no window station and
# every windowed call fails — WebView2 included, which reports it as an
# environment-creation failure and reads like a missing runtime.
description = "Run the windowed probes in the VM — glaze bridge, then every native capability"
depends = ["probes"]
run = [
  "go run ./cmd/irgo-winvm run -gui -timeout 3m -vm $VM $PROBE_DIR/glaze-verify-arm64.exe",
  "go run ./cmd/irgo-winvm run -gui -timeout 3m -vm $VM $PROBE_DIR/glaze-verifyevents-arm64.exe",
  "go run ./cmd/irgo-winvm run -gui -timeout 3m -vm $VM $PROBE_DIR/nativeall-arm64.exe",
]

[tasks."vm:up"]
# create + RestartUTM + boot. The restart is not a workaround that can be
# dropped: UTM enumerates its bundle directory only at launch, so a VM written
# while it is running does not exist as far as utmctl or the UI are concerned,
# and nothing says so.
description = "Create a VM from the cached ISO and boot it — the usual entry point"
run = "go run ./cmd/irgo-winvm up -iso .cache/win11-arm64.iso -name $VM -probes $PROBE_DIR"
depends = ["probes"]

# --- upstream:* — working on glaze and native, not around them ---------------
#
# The README's rule is that a glaze or native bug is fixed at crgimenes, never
# worked around here. A rule nobody can act on is a wish, so this is the half
# that makes it practical: edit their code and ours in the same loop, build the
# probes against the edit, and run them on Windows — without waiting for a
# release, a merge, or a reply.
#
#   mise run upstream:clone     get the repositories
#   mise run upstream:link      every module now builds against your clones
#   ... edit their code and ours, `mise run check`, `mise run vm:probe-gui` ...
#   mise run upstream:diff      what you changed — this is the pull request
#   mise run upstream:unlink    back to the released modules
#
# The switch is a `go.work`, not an edit to any `go.mod`. That matters: a
# `replace` in go.mod is a tracked file, and one committed by accident points
# the whole project at a path on one laptop — anyone else's build then fails
# with a directory that does not exist. go.work is gitignored here, is the
# mechanism Go provides for exactly this, and covers all four modules at once
# so the CLI, the probes and the examples cannot disagree about which glaze
# they are built against.
#
# It is deliberately NOT automatic. `mise run check` builds what a user of this
# repo would get; only after upstream:link does it build what you are proposing,
# and upstream:status will tell you which of the two you are looking at.

[tasks."upstream:clone"]
description = "Clone glaze and native next to this repo, for working on them"
run = '''
set -e
mkdir -p "$UPSTREAM_DIR"
for repo in glaze native; do
  if [ -d "$UPSTREAM_DIR/$repo/.git" ]; then
    echo "have $UPSTREAM_DIR/$repo"
  else
    git clone "https://github.com/crgimenes/$repo.git" "$UPSTREAM_DIR/$repo"
  fi
done
'''

[tasks."upstream:link"]
# One go.work at the root listing all four modules. `use` alone is not enough:
# without the replaces the workspace still resolves glaze from the module cache
# at the version in go.mod, and the edit being tested is silently ignored — a
# build that looks like it proves something and proves nothing.
description = "Point every module at the LOCAL glaze/native clones"
run = '''
set -e
for repo in glaze native; do
  if [ ! -d "$UPSTREAM_DIR/$repo" ]; then
    echo "missing $UPSTREAM_DIR/$repo — run: mise run upstream:clone" >&2
    exit 1
  fi
done

cat > "$MISE_PROJECT_ROOT/go.work" <<EOF
// Written by \`mise run upstream:link\`; removed by \`mise run upstream:unlink\`.
// Gitignored on purpose — it names absolute paths on one machine.
go 1.26.5

use (
	.
	./probe
	./glaze-probes
	./examples
)

replace github.com/crgimenes/glaze => $UPSTREAM_DIR/glaze

replace github.com/crgimenes/native => $UPSTREAM_DIR/native
EOF

echo "linked. every module now builds against:"
echo "  $UPSTREAM_DIR/glaze"
echo "  $UPSTREAM_DIR/native"
echo "undo with: mise run upstream:unlink"
'''

[tasks."upstream:unlink"]
description = "Go back to the released glaze and native modules"
run = '''
set -e
rm -f "$MISE_PROJECT_ROOT/go.work" "$MISE_PROJECT_ROOT/go.work.sum"
echo "unlinked — back to the versions in each go.mod"
'''

[tasks."upstream:status"]
# Which of the two you are building is the thing that is easy to lose track of
# and expensive to get wrong: a fix that "works" against a stale module cache,
# or a regression blamed on upstream that is really an uncommitted local edit.
description = "Say whether builds resolve glaze/native locally or from the module cache"
run = '''
set -e
if [ -f "$MISE_PROJECT_ROOT/go.work" ]; then
  echo "mode: LINKED to local clones"
else
  echo "mode: released modules (as a user of this repo would get)"
fi
echo
go -C examples list -m -f '{{"{{.Path}}  {{.Version}}{{with .Replace}}  =>  {{.Dir}}{{end}}"}}' \
  github.com/crgimenes/glaze github.com/crgimenes/native
'''

[tasks."upstream:diff"]
# What would be offered upstream, in one place. Uncommitted work in those
# clones is invisible from here otherwise, and it is the thing most likely to
# be forgotten between sessions.
description = "Show what you have changed in the glaze and native clones"
run = '''
set -e
for repo in glaze native; do
  echo "=== $repo ==="
  git -C "$UPSTREAM_DIR/$repo" status --short
  git -C "$UPSTREAM_DIR/$repo" diff --stat
  echo
done
'''

[tasks."upstream:verify"]
# The measurement behind a claim that an upstream fix works: their tests, our
# tests, and Windows binaries built from the edit. Nothing here is taken on
# faith from a diff that compiles.
description = "Run glaze's and native's own tests, then build our probes against them"
depends = ["upstream:link"]
run = '''
set -e
echo "--- glaze's own tests ---"
go -C "$UPSTREAM_DIR/glaze" test ./...
echo "--- native's own tests ---"
go -C "$UPSTREAM_DIR/native" test ./...

echo "--- this repo, built against them ---"
mkdir -p "$PROBE_DIR"
for arch in arm64 amd64; do
  CGO_ENABLED=0 GOOS=windows GOARCH=$arch \
    go -C examples build -o "$PROBE_DIR/nativeall-upstream-$arch.exe" ./nativeall
done
go -C examples test ./...

echo
echo "built $PROBE_DIR/nativeall-upstream-{arm64,amd64}.exe"
echo "prove it on Windows:  mise run vm:run $PROBE_DIR/nativeall-upstream-arm64.exe"
echo "still LINKED — mise run upstream:unlink when you are done"
'''

[tasks."vm:run"]
# The general form of vm:probe-gui, for one binary you name — which is what
# verifying an upstream fix on Windows needs.
#
# The argument is declared with `usage` rather than the older {{arg(...)}}
# template, which mise deprecates and removes in 2027.5.
description = "Run one local binary in the VM with a display, and print its output"
usage = 'arg "<exe>" help="the .exe to push into the VM and run"'
run = "go run ./cmd/irgo-winvm run -gui -timeout 4m -vm $VM $usage_exe"

[tasks.doctor]
# Also inventories everything the project needs that git does not have — ~31 GB
# of it. A clone is about a megabyte; none of this runs without the rest, and
# every piece fails a long way from its cause when absent.
description = "UTM, guest tools, disk space, what this machine can test, and every file outside git"
run = [
  "go run ./cmd/irgo-winvm doctor",
  "go run ./cmd/irgo-winvm targets",
]

[tasks."iso:status"]
# The ISO is hardlinked into UTM's bundle, so it is not the spare copy it looks
# like: writing to the cached path truncates the media the VM boots from. This
# shows every name it has, and every other Windows image on the machine with
# whether anything actually uses it.
description = "Every name the working ISO has, and any other Windows images lying around"
run = "go run ./cmd/irgo-winvm iso"

[tasks."iso:protect"]
# Run this once. It costs nothing and it is the difference between a mistake and
# a 5 GB re-download of something Microsoft rate-limits.
description = "Make the working ISO immutable — no write, truncate, rename or delete"
run = "go run ./cmd/irgo-winvm iso -protect"

[tasks."iso:unprotect"]
# Needed before `delete` can remove a VM, because rm refuses an immutable file
# and the bundle's install.iso is the same inode.
description = "Clear the immutable flag, so the ISO can be replaced or its VM deleted"
run = "go run ./cmd/irgo-winvm iso -unprotect"

[tasks."iso:build"]
# The replacement for CrystalFetch, as one command.
#
# Everything is Go except two steps that genuinely cannot be: reading
# LZMS-compressed .esd archives (wimlib) and writing the bootable ISO
# (xorriso). Both report what to `brew install` when missing, rather than
# failing with "executable file not found".
#
# PROVEN 12 Aug 2026: an ISO built this way booted UTM straight into Windows
# Setup, with no "Press any key", and installed unattended. RESULTS.md, and
# docs/screens/self-built-iso-installing-windows.png.
description = "Turn a downloaded .esd into a bootable Windows ARM64 ISO"
usage = 'arg "<esd>" help="the .esd from fetch-iso"'
run = "go run ./cmd/irgo-winvm build-iso -esd $usage_esd"

[tasks."iso:build-from"]
# The same masterer against media already laid out on disk — which is how the
# approach was first proven, by rebuilding the ISO we already had.
description = "Build a bootable ISO from a directory of Windows media"
usage = 'arg "<dir>" help="directory holding the media layout"'
run = "go run ./cmd/irgo-winvm build-iso -from $usage_dir"

[tasks."vm:iso-test"]
# Boot a self-built ISO in a disposable VM and photograph the result.
#
# Two things that make a boot test lie to you, both learned the hard way:
# `boot` never returns for a VM booting Setup, because a guest agent only
# exists once Windows is installed — judge it by the screenshot. And UTM
# lists a deleted VM until it is relaunched, so creating one under an
# existing name silently reuses the old bundle and tests the PREVIOUS ISO.
description = "Boot a self-built ISO in a throwaway VM and screenshot it"
usage = 'arg "<iso>" help="the ISO to boot"'
run = """
set -e
go run ./cmd/irgo-winvm delete -vm iso-test -force 2>/dev/null || true
osascript -e 'tell application "UTM" to quit' 2>/dev/null || true
sleep 5
go run ./cmd/irgo-winvm create -iso "$usage_iso" -name iso-test -probes "$PROBE_DIR"
open -a UTM; sleep 10
go run ./cmd/irgo-winvm boot -vm iso-test &
sleep 170
go run ./cmd/irgo-winvm screenshot -vm iso-test -name iso-test-boot
echo "Look at the PNG above. Windows Setup means the ISO is good."
"""
[tasks."iso:catalog"]
# What Microsoft's Media Creation Tool catalog says is available: the direct
# download URL, the size, and the SHA-1 — which no GUI download gives you.
description = "List the Windows ARM64 images Microsoft publishes, with their SHA-1"
run = "go run ./cmd/irgo-winvm fetch-iso -list"
