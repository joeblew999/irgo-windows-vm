# The release: two raw Mac binaries and SHA256SUMS, published by release.yml on
# a v* tag. `mise run go:build` runs this same file locally.
#
# macOS only, deliberately. The tool drives UTM, which is macOS-only, so a Linux
# or Windows binary would build and then refuse to do anything useful. The
# cross-compile in go:check exists to prove `targets` still reports honestly on
# those hosts, not to ship them.
version: 2

project_name: irgo-winvm

builds:
  - id: irgo-winvm
    main: ./cmd/irgo-winvm
    # Built as irgo-winvm, the command's name, in dist/irgo-winvm_darwin_<arch>/;
    # the archive below publishes it as irgo-winvm-darwin-<arch>, and
    # SHA256SUMS names it that way. The build's name is what the Homebrew cask
    # links onto PATH (`binary "irgo-winvm-darwin-arm64", target: "irgo-winvm"`):
    # built under its download name, as until v0.4.1, brew installed a command
    # called irgo-winvm-darwin-arm64. Same bytes either way — the checksums of
    # one commit were compared before and after this change, and matched.
    binary: irgo-winvm
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64, amd64]
    # -buildvcs=false so the checksums mean something. Go stamps the commit, the
    # build time and whether the tree was dirty into every binary, so the same
    # source built in CI and on a laptop differed -- and the release notes used
    # to claim a maintainer could produce byte-identical artefacts locally,
    # which was measured and was not true: CI had vcs.modified=false, a working
    # copy had true, and a clean worktree had no vcs stamps at all. Three
    # different binaries, one commit. v0.1.0's published binary could not be
    # reproduced from its own tag for exactly this reason.
    flags:
      - -trimpath
      - -buildvcs=false
    # The version, compiled in, so it is part of the bytes the checksums cover.
    #
    # The tag itself (v0.4.1), not .Version (0.4.1): every release before
    # GoReleaser printed the v, and `version` and `doctor` should not change
    # what they say because the build tool did.
    #
    # A snapshot says `dev` (see snapshot below) rather than claiming the last
    # tag: a commit after v0.4.1 is not v0.4.1.
    ldflags:
      - -s -w -X main.version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
    # The file's mtime from the commit, not the clock, so two builds of one
    # commit are identical on disk as well as in content.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # The binary itself, not a tarball of it. A user who downloads one thing
  # should be able to run that thing: `tar xzf` before you can try a CLI is a
  # step that exists only because the release process wanted it. It also made
  # the published checksum useless for verifying the binary, since gzip stamps
  # a timestamp into the archive and no two builds of identical code produced
  # the same tar.
  #
  # Named as every release before GoReleaser named them -- irgo-winvm-darwin-arm64
  # -- so the README's download and releases/latest links keep working.
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# `brew install joeblew999/tap/irgo-winvm`. A cask, not a formula: GoReleaser
# deprecated `brews` for prebuilt binaries in v2.10, and a cask installs the
# binary as published, with the checksum GoReleaser computed.
#
# The tap repository joeblew999/homebrew-tap must exist, and release.yml must
# have HOMEBREW_TAP_GITHUB_TOKEN (a token that can push to it). Until then the
# upload is skipped, so a release without the tap still publishes everything
# else — the cask file is still written to dist/homebrew/ for inspection.
homebrew_casks:
  - name: irgo-winvm
    repository:
      owner: joeblew999
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    directory: Casks
    homepage: https://joeblew999.github.io/irgo-windows-vm/
    description: Run a Go program built on your Mac on a real Windows 11 ARM64 VM
    license: MIT
    commit_author:
      name: joeblew999
      email: joeblew999@users.noreply.github.com
    commit_msg_template: "irgo-winvm {{ .Tag }}"
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}false{{ else }}true{{ end }}'
    # The binary is not signed by a Developer ID, and Homebrew quarantines
    # what a cask downloads, so Gatekeeper would refuse to run it. This is
    # the same step the manual install asks of you.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", staged_path.to_s]
          end
    caveats: |
      Next: irgo-winvm doctor
      For an AI agent: claude mcp add irgo-winvm -- irgo-winvm mcp

snapshot:
  # Anything that is not a clean checkout of a tag. Before GoReleaser a
  # non-release build also said `dev`; `-dirty` is kept from then too, since
  # whatever is uncommitted is not what any commit says.
  version_template: "dev{{ if .IsGitDirty }}-dirty{{ end }}"

# The commits since the last tag, grouped. Conventional prefixes (feat:, fix:,
# docs:) are matched first; the rest by the area this repository's subjects
# start with. Merges, plans and the recorded glaze verdicts are not changes a
# user can see.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^Merge '
      - '^plans?:'
      - '^GLAZE-STATUS'
      - '^gofmt '
  groups:
    - title: New
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: The tool
      regexp: '^(vm-|iso-|app|doctor|mcp|status|glaze-check|golden|utmvm|cmd|internal|RunInstall|registerBundle|autounattend|desktop reset|first run|Split|join)'
      order: 2
    - title: Documentation
      regexp: '^(docs(\(.+\))?:|README|RESULTS|ROADMAP|CONTRIBUTING|THREAT-MODEL|DEVELOPMENT|UPSTREAM|site)'
      order: 3
    - title: Tests, CI and examples
      regexp: '^(test|tests|ci|CI|release|pages|conformance|examples|drive|glazecheck|glaze|worker|mise|vm:test|iso:test|upstream)'
      order: 4
    - title: Other
      order: 999

release:
  # The asset list's install script, so `curl | sh` can be pinned to a release.
  extra_files:
    - glob: ./install.sh
  header: |
    A Windows 11 ARM64 VM on Apple Silicon, and your Go program running inside it,
    for a developer on a Mac and for an AI agent over MCP.

    ## Install

    ```sh
    curl -fsSL https://github.com/joeblew999/irgo-windows-vm/releases/download/{{ .Tag }}/install.sh | sh
    ```

    It downloads the binary for your Mac, checks it against `SHA256SUMS`, and
    installs it as `~/.local/bin/irgo-winvm` (`IRGO_WINVM_DIR` to put it elsewhere).
    {{- if envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}
    Or with Homebrew: `brew install --cask joeblew999/tap/irgo-winvm`.
    {{- end }}
    Or with Go: `go install github.com/joeblew999/irgo-windows-vm/cmd/irgo-winvm@{{ .Tag }}`.

    Or download `irgo-winvm-darwin-arm64` (Apple Silicon) below, then:

        chmod +x irgo-winvm-darwin-arm64
        xattr -d com.apple.quarantine irgo-winvm-darwin-arm64
        mv irgo-winvm-darwin-arm64 ~/.local/bin/irgo-winvm    # or anywhere on your PATH

    The binary is not signed with an Apple Developer ID. Downloaded with a
    browser it carries macOS's quarantine flag, and Gatekeeper refuses to run it
    until the flag is cleared; `curl`, Homebrew's cask and `go install` take care
    of that.

    ## First run

    ```sh
    irgo-winvm doctor
    ```

    It says what is set up and what to run next, in order: UTM (installed for
    you), the Windows installer (`iso-create -fetch`), a VM (`vm-create -install`,
    about 45 minutes unattended, once), then your program
    (`app-create app.exe`, built with `GOOS=windows GOARCH=arm64 CGO_ENABLED=0`).
    macOS asks once to let your terminal control UTM: click OK.

    ## For AI agents

    ```sh
    claude mcp add irgo-winvm -- irgo-winvm mcp
    ```

    Other clients, every tool, the typical session and the exit codes:
    <https://joeblew999.github.io/irgo-windows-vm/mcp.html> (`irgo-winvm mcp -h`
    prints the essentials). It serves stdin and stdout; read the
    [threat model](https://joeblew999.github.io/irgo-windows-vm/threat-model.html)
    before `-http`.

    ## A VM in seconds: the golden image

    After one install, `vm-golden-create -vm <that VM>` seals it, and every
    `vm-create` after that is a clone that answers in about 23 seconds. With a
    private R2 cache of your own (`IRGO_GOLDEN_URL` and `IRGO_GOLDEN_TOKEN`),
    `vm-create -install` on another of your Macs pulls the golden image (8.4 GB,
    under 5 minutes measured) instead of installing. The cache is for your own
    licensed machines and CI only: the Windows licence forbids sharing the image,
    and every running clone needs its own licence. Never make it public.

    Checksums are in `SHA256SUMS`, and they are reproducible: `mise run go:build`
    on a clean checkout of the same tag produces byte-identical binaries.
