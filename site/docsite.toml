# The docs site: https://joeblew999.github.io/irgo-windows-vm/
#
# Built by docsite (../docsite, its README has every key): `mise run
# site:build`, `site:serve`, and `site:check` in go:check. Paths are from the
# repository root.
#
# The pages, in navigation order. Nothing is discovered by scanning a
# directory, so nothing is published by accident: a page not listed here is
# not on the site. A page with `nav` is in the header; one with `parent` is
# listed in the footer and lights up its parent's entry, which keeps the header
# to one line at 1280 px. Three pages have no markdown file: a hook in this
# directory generates each (`go run ./site <name>`, see main.go).
#
# The header is docs/'s sections (docs/writing.md: Getting started, Guides,
# Concepts, Reference, This repository), each section's pages under it. Every
# `out` is the name the page had before the docs moved into those sections,
# because messages in released binaries and other sites link them.

name = "irgo-windows-vm"
root = ".."
out = "site/dist"
repo = "https://github.com/joeblew999/irgo-windows-vm"
base = "https://joeblew999.github.io/irgo-windows-vm/"
license = "MIT"
screens = "docs/screens"

[check]
# Links into the site from outside it: messages the binary prints (which link
# the site, never a docs/ path), the issue forms, and absolute URLs in the
# markdown. utmvm.SiteURL + "page.html#frag" counts as one.
sources = ["{cmd,internal,.github,docs}/**/*.{go,md,yml,yaml}", "README.md", "AGENTS.md"]
prefixes = ['SiteURL\s*\+\s*"']

[llms]
about = """
Documentation for a tool that installs Windows 11 ARM64 on Apple Silicon
unattended and runs Go binaries inside it, and makes Ubuntu Linux VMs to SSH
into. Generated from the repository's
own markdown, so it cannot disagree with the source.
"""
full_note = """
Generated from the same source as the site. Every page but two comes from
markdown in the repository; the command reference and the MCP page have no
source file and are captured from the compiled binary, so a wrong flag there
is a bug in Go, not in any markdown.
"""
index_note = """
Every page here is generated from markdown in the repository, so the source
is authoritative and this is never edited by hand.

One page is different, and it is the reason to prefer these files over
fetching the raw markdown from GitHub: the command reference has **no source
file**. It is captured from the compiled binary at build time — `irgo-winvm
help` and `-h` for every command — so that no flag, default or usage string
is ever transcribed. Fetching the repository's .md files gets you every other
page and silently omits it, and the MCP page with it.
"""
robots_note = """
Prefer those over fetching the markdown from the repository: the command
reference is captured from the binary at build time and has no source file,
so the raw-markdown route silently omits it.
"""

[[page]]
src = "docs/README.md"
out = "index.html"
title = "irgo-windows-vm"
blurb = "What it is for, what is what, and every page"

[[page]]
src = "docs/getting-started.md"
out = "getting-started.html"
title = "Getting started"
nav = "Get started"
blurb = "Install it, make your first VM, run your first program"

[[page]]
src = "docs/guides.md"
out = "guides.html"
title = "Guides"
nav = "Guides"
blurb = "One job per page: using it, from an agent, testing glaze"

[[page]]
src = "docs/guides/using.md"
out = "using.html"
title = "Using it"
parent = "guides.html"
blurb = "Each command, exit codes, costs, Linux VMs, the golden image and the private cache"

[[page]]
src = "docs/guides/agents.md"
out = "agents.html"
title = "For agents"
parent = "guides.html"
blurb = "Drive it from an AI agent, over MCP or HTTP, and file issues"

[[page]]
src = "docs/guides/testing.md"
