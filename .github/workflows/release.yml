# Publish binaries a user can download and run.
#
# Same shape as check.yml: install mise, call the task. The build lives in
# `mise run go:build` so a maintainer can produce byte-identical artefacts
# locally and see what CI will publish before tagging.
#
# macOS only, deliberately. The tool drives UTM, which is macOS-only, so a Linux
# binary would build and then refuse to do anything useful.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to build (a dry run; nothing is published)"
        required: false
        default: dev

permissions:
  contents: write

jobs:
  release:
    # Built on macOS so the binaries are produced on the platform they target,
    # and so `go:check` has already run against a real Mac before anything ships.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.2.4

      # Nothing ships that has not passed the same gate a contributor runs.
      - run: mise run go:check
      - run: mise run go:lint

      - name: build
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: mise run go:build

      - name: publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes "$(printf '%s\n' \
              'A Windows 11 ARM64 VM on Apple Silicon, and your Go binaries running inside it.' \
              '' \
              '    tar xzf irgo-winvm-darwin-arm64.tar.gz' \
              '    ./irgo-winvm-darwin-arm64' \
              '' \
              'Three steps, in order: iso-create, vm-create, app-create. Each has an undo.' \
              'It installs UTM itself if you do not have it.' \
              '' \
              'Checksums are in SHA256SUMS.')"

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: irgo-winvm-dev
          path: dist/
