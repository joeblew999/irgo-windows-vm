# Publish binaries a user can download and run.
#
# Same shape as check.yml: install mise, call the task. The build lives in
# `mise run go:build` so a maintainer can produce byte-identical artefacts
# locally and see what CI will publish before tagging.
#
# That sentence was false when it was written, and is true now because it was
# checked. v0.1.0's published binary could not be reproduced from its own tag:
# Go stamps the commit, the build time and a dirty-tree flag into every binary,
# so CI (vcs.modified=false), a working copy (true) and a clean worktree (no
# stamps at all) produced three different binaries from one commit. go:build
# passes -buildvcs=false, and the checksums mean something again.
#
# macOS only, deliberately. The tool drives UTM, which is macOS-only, so a Linux
# binary would build and then refuse to do anything useful.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to build (a dry run; nothing is published)"
        required: false
        default: dev

permissions:
  contents: write

jobs:
  release:
    # Built on macOS so the binaries are produced on the platform they target.
    # The gate itself is not repeated here — see the guard below.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.2.4

      # go:build compiles for two Mac architectures; same cache as everywhere
      # else so it is not doing that from cold.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # Nothing ships that has not passed the gate — but the gate is not run
      # again here.
      #
      # A tag names a commit that `check` has already run on, on both a Mac and
      # ubuntu. Re-running it cost 124s of a 171s release, 72% of the whole
      # thing, to re-derive an answer GitHub already had.
      #
      # So this asks instead, and refuses to publish if the answer is missing or
      # red. That is stricter than what it replaced in one way worth naming: the
      # old version would happily build a tag whose commit had never been
      # checked, because it checked it right there and then. This will not.
      #
      # Only for a real publish. A workflow_dispatch dry run builds nothing that
      # reaches anybody, so it does not need the guard and should not be blocked
      # by a branch that has never been pushed.
      - name: the tagged commit must have a green check
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          echo "commit: $sha"

          # --json is used rather than parsing text: a column layout change
          # would silently turn this into a check that passes on anything.
          runs=$(gh run list --workflow=check.yml --commit "$sha" \
                   --json conclusion,status,databaseId,url)

          if [ "$(echo "$runs" | jq 'length')" = "0" ]; then
            echo "::error::no check run exists for $sha — refusing to publish an unverified commit"
            exit 1
          fi
          echo "$runs" | jq -r '.[] | "  \(.status)/\(.conclusion // "pending")  \(.url)"'

          if [ "$(echo "$runs" | jq '[.[] | select(.conclusion == "success")] | length')" = "0" ]; then
            echo "::error::no SUCCESSFUL check run for $sha — refusing to publish"
            exit 1
          fi
          echo "a green check exists for this commit; publishing"

      - name: build
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: mise run go:build

      - name: publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/irgo-winvm-darwin-* dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes "$(printf '%s\n' \
              'A Windows 11 ARM64 VM on Apple Silicon, and your Go binaries running inside it.' \
              '' \
              'Download the one for your Mac — `arm64` for Apple Silicon — then:' \
              '' \
              '    chmod +x irgo-winvm-darwin-arm64' \
              '    xattr -d com.apple.quarantine irgo-winvm-darwin-arm64' \
              '    ./irgo-winvm-darwin-arm64' \
              '' \
              'The second line is macOS refusing anything downloaded from the internet;' \
              'without it Gatekeeper reports the binary as damaged.' \
              '' \
              'Three steps, in order: iso-create, vm-create, app-create. Each has an undo.' \
              'It installs UTM itself if you do not have it.' \
              '' \
              'Checksums are in SHA256SUMS, and they are reproducible: `mise run go:build`' \
              'on the same tag produces byte-identical binaries.')"

      - uses: actions/upload-artifact@v7.0.1
        if: github.ref_type != 'tag'
        with:
          name: irgo-winvm-dev
          path: dist/
